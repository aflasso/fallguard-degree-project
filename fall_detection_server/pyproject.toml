[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection-server"
version = "0.1.0"
description = "Servidor central del sistema de detección de caídas"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "firebase-admin",
    "websockets",
    "python-dotenv",
    "google-cloud-storage",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "application*", "infrastructure*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"