services:

  fall-detection-server:
    build: .
    container_name: fall-detection-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"        # expuesto al host para la app móvil (REST) y desarrollo
    volumes:
      - ./credentials:/app/credentials:ro   # serviceAccountKey.json — nunca en la imagen
    networks:
      - fallguard

networks:
  fallguard:
    name: fallguard        # nombre exacto — evita el prefijo del proyecto
    driver: bridge
