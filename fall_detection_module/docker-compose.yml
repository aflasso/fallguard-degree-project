services:

  # ── Módulo de producción ────────────────────────────────────────────────────
  # CAMERA_SOURCE se define en docker.env (URL del stream del celular).
  module-1:
    build: .
    container_name: fg-module-1
    restart: unless-stopped
    ipc: host
    env_file: docker.env
    environment:
      DEVICE: cuda:0
    volumes:
      - module1_data:/app/data
      - ./models:/app/models:ro
    networks:
      - fallguard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Módulos de prueba con videos del dataset LE2I ───────────────────────────
